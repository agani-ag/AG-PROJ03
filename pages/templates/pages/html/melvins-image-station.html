<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Melvin's Image Station</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message-card {
            max-width: 500px;
            width: 100%;
            padding: 24px;
        }
        .underline-red {
            text-decoration: underline;
            text-decoration-color: red;
            text-decoration-thickness: 2px;
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="card shadow-sm message-card mx-auto text-center">
            <div class="card-body">
                <p class="fs-5 mb-4">
                    அன்பார்ந்த பயனர்களுக்கு,
                </p>

                <p class="fs-6 mb-4">
                    <strong class="underline-red">Melvin's Image Station</strong> தற்காலிகமாக செயல்படாது.
                </p>

                <p class="fs-6 mb-0">
                    நன்றி<br>இப்படிக்கு,<br>
                    <strong id="secretRedirect" style="cursor:pointer;">Melvin's இதயம்❤️</strong>
                </p>
            </div>
        </div>
    </div>

</body>
<script>
let clickCount = 0;
let timer;

document.getElementById("secretRedirect").addEventListener("click", function () {
    clickCount++;
    clearTimeout(timer);

    timer = setTimeout(() => clickCount = 0, 1000);

    if (clickCount === 3) {
        const url = new URL(window.location.href);
        url.searchParams.set("valid", "1");
        window.location.href = url.toString();
    }
});
</script>
</html>
