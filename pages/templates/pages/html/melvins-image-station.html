<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Melvin&#39;s Image Station</title>
<style>
/* Our own CSS. The page used to pull Bootstrap off a CDN to draw one card, which meant
   it rendered unstyled until a network round-trip came back — on a phone, on a bad
   connection, that is the whole page. Forty lines here and it paints immediately. */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;min-height:100dvh;
  background:#f6f7f9;color:#1b2430;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* The picture takes whatever height is left once the notice has had its share, and
   shrinks to fit rather than overflowing. flex:1 with min-height:0 is the part that
   makes it give way — without the min-height a flex item refuses to go below its
   content size and the page scrolls instead. */
.shot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 16px 4px}
.shot img{
  max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
  border-radius:18px;background:#fff;
  box-shadow:0 10px 30px rgba(20,28,45,.10),0 1px 2px rgba(20,28,45,.06);
}
.note{
  flex:none;width:min(560px,100%);margin:10px auto 16px;padding:18px 20px;
  background:#fff;border:1px solid #e5e9f0;border-radius:18px;text-align:center;
  box-shadow:0 1px 2px rgba(20,28,45,.05);
}
.note p{margin:0 0 14px;line-height:1.75}
.note p:last-child{margin-bottom:0}
.lead{font-size:1.05rem}
.underline-red{text-decoration:underline;text-decoration-color:#e0243f;text-decoration-thickness:2px}
#secretRedirect{cursor:pointer;-webkit-user-select:none;user-select:none}

/* Landscape, or anything wide: the picture is portrait, so side by side wastes far less
   room than stacking and the notice stops being pushed off the bottom. */
@media (min-width:820px) and (orientation:landscape){
  body{flex-direction:row;align-items:center;gap:8px}
  .shot{padding:18px 8px 18px 18px}
  .note{margin:18px 18px 18px 8px;flex:0 1 420px}
}
@media (prefers-color-scheme:dark){
  body{background:#11141c;color:#e9ecf4}
  .note{background:#1a1e28;border-color:#262b38;box-shadow:none}
  .shot img{background:#1a1e28}
}
</style>
</head>

let clickCount = 0;
