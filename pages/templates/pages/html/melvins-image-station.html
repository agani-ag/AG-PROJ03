<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Melvin&#39;s Image Station</title>
<style>
/* Our own CSS and our own SVG. Nothing is loaded from outside this file: no CDN, no
   webfont, no image, no 3D library. The character is drawn in about a hundred shapes
   and animated by transforms, which is why the whole page is a few kilobytes and
   starts the moment it arrives. */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;min-height:100dvh;
  background:#f6f7f9;color:#1b2430;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;
}

/* She takes whatever height is left once the notice has had its share, and shrinks to
   fit rather than overflowing. flex:1 with min-height:0 is the load-bearing part: a
   flex item otherwise refuses to go below its content size and the page scrolls. */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;
       justify-content:center;margin:10px 12px 0;padding:0 10px 2%;
       border-radius:20px;overflow:hidden;isolation:isolate}

/* The hillside is its own layer, stretched to cover the stage, while SHE is sized to fit
   inside it. One SVG for both would mean the landscape letterboxing with her — a strip of
   mountain down the middle of a wide screen with page background either side. `slice`
   crops the scene instead, so it always fills. */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.scene-shade{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(130% 80% at 50% 12%,rgba(255,243,214,.30),transparent 62%),
             radial-gradient(120% 70% at 50% 108%,rgba(16,34,24,.28),transparent 60%)}
#toon{position:relative;z-index:2;max-width:100%;max-height:100%;height:auto;width:auto;
      display:block;overflow:visible;touch-action:manipulation;
      filter:drop-shadow(0 10px 16px rgba(18,36,24,.28))}
.bubble{z-index:3}

/* Clouds drift, slowly enough that you notice only if you watch. */
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(112%)}}
.cloud{animation:drift linear infinite}
.cloud.a{animation-duration:95s}
.cloud.b{animation-duration:140s;animation-delay:-40s}

.bubble{
  position:absolute;left:50%;top:8px;transform:translateX(-50%) scale(.9);
  max-width:min(86%,440px);padding:10px 15px;border-radius:16px;
  background:#fff;border:1px solid #e5e9f0;box-shadow:0 8px 24px rgba(20,28,45,.12);
  font-size:.95rem;line-height:1.5;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;
  margin-left:-6px;background:#fff;border-right:1px solid #e5e9f0;
  border-bottom:1px solid #e5e9f0;transform:rotate(45deg)}

.tools{flex:none;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 12px 0}
.tools button{
  min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #d9dfe8;
  background:#fff;color:#1b2430;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
  max-width:62vw;
}
.tools button:active{transform:scale(.97)}
.tools button[aria-pressed="true"]{background:#105498;border-color:#105498;color:#fff}
.hint{flex:none;text-align:center;font-size:.76rem;color:#7a8698;padding:7px 12px 0}
#voiceNote{padding-top:3px}
#voiceNote:empty{display:none}

.note{
  flex:none;width:min(560px,100%);margin:10px auto 16px;padding:18px 20px;
  background:#fff;border:1px solid #e5e9f0;border-radius:18px;text-align:center;
  box-shadow:0 1px 2px rgba(20,28,45,.05);
}
.note p{margin:0 0 14px;line-height:1.75}
.note p:last-child{margin-bottom:0}
.lead{font-size:1.05rem}
.underline-red{text-decoration:underline;text-decoration-color:#e0243f;text-decoration-thickness:2px}
#secretRedirect{cursor:pointer;-webkit-user-select:none;user-select:none}

/* Touchable parts of her. Invisible, but a finger-sized target over each one — tapping
   a drawn eyebrow is not a thing anybody can do reliably on a phone. */
.hit{fill:transparent;cursor:pointer}

/* Everything that moves, moves by transform, which the compositor can do without
   relaying out the page. */
#body,#head,#armR,#armL,.lid,#maw,.blush,.iris{transform-box:fill-box;transform-origin:center}
#head{transform-origin:50% 92%}
#armR{transform-origin:76% 6%}
#armL{transform-origin:24% 6%}
#body,#head,#armR,#armL{transition:transform .32s cubic-bezier(.34,1.3,.5,1)}
.lid{transition:transform .09s ease}
.blush{transition:opacity .3s ease}
#maw{transition:transform .07s ease}

@media (min-width:820px) and (orientation:landscape){
  body{flex-direction:row;align-items:center;gap:6px}
  .stage{margin:16px 6px 16px 16px;padding:0 10px 2%}
  .side{flex:0 1 430px;display:flex;flex-direction:column;justify-content:center;
        padding:16px 16px 16px 6px}
  .note{margin:12px auto}
}
@media (prefers-color-scheme:dark){
  body{background:#11141c;color:#e9ecf4}
  .note,.bubble,.tools button{background:#1a1e28;border-color:#262b38;color:#e9ecf4}
  .scene{filter:brightness(.58) saturate(.86) hue-rotate(-4deg)}
  .scene-shade{background:radial-gradient(130% 80% at 50% 12%,rgba(255,243,214,.12),transparent 62%),
               radial-gradient(120% 70% at 50% 108%,rgba(4,10,7,.45),transparent 60%)}
  .bubble:after{background:#1a1e28;border-color:#262b38}
  .note{box-shadow:none}
  .hint{color:#6b7384}
}
@media (prefers-reduced-motion:reduce){
  #body,#head,#armR,#armL,.lid,#maw,.blush,.bubble{transition:none}
  .cloud{animation:none}
}
</style>
</head>
<body>

<div class="stage">
  <!-- Morning, somewhere green and high up. Four ranges fading back into haze, because
       distance in a landscape is colour, not size: the far ridge is barely bluer than the
       sky and that alone puts miles between it and the meadow she is standing in. -->
  <svg class="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9ec9e6"/><stop offset=".42" stop-color="#cfe6ea"/>
        <stop offset=".70" stop-color="#f7e6c3"/><stop offset="1" stop-color="#fdf2d8"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">

        <stop offset=".38" stop-color="#ffe9ac" stop-opacity=".48"/>
        <stop offset="1" stop-color="#ffe9ac" stop-opacity="0"/>

      </linearGradient>
      <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5d9166"/><stop offset="1" stop-color="#6ea073"/>
      </linearGradient>
      <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#558c58"/><stop offset="1" stop-color="#3c7343"/>
      </linearGradient>
    </defs>

    <rect width="400" height="300" fill="url(#sky)"/>
    <circle cx="300" cy="92" r="78" fill="url(#sunGlow)"/>
    <circle cx="300" cy="92" r="16" fill="#fffbe9"/>

    <g class="cloud a" opacity=".75">
      <ellipse cx="60" cy="54" rx="30" ry="9" fill="#fff"/>
      <ellipse cx="78" cy="49" rx="20" ry="8" fill="#fff"/>

    <g class="cloud b" opacity=".55">
      <ellipse cx="170" cy="30" rx="24" ry="7" fill="#fff"/>
      <ellipse cx="186" cy="26" rx="15" ry="6" fill="#fff"/>
    </g>

    <!-- the far ridge, almost the colour of the sky -->
    <path d="M0,150 L36,120 L60,138 L96,104 L128,140 L164,116 L198,144 L234,118
             L268,146 L304,124 L340,150 L372,132 L400,154 L400,210 L0,210 Z"

    <path d="M96,104 L84,118 L108,118 Z M234,118 L224,130 L246,130 Z" fill="#f3f8fa" opacity=".8"/>

    <!-- mist lying in the valley, which is what makes it morning -->
    <ellipse cx="120" cy="166" rx="150" ry="13" fill="#ffffff" opacity=".45"/>
    <ellipse cx="310" cy="172" rx="130" ry="11" fill="#ffffff" opacity=".38"/>

    <path d="M0,172 L30,152 L58,168 L94,140 L126,170 L160,148 L194,174 L230,152
             L262,178 L296,156 L330,180 L364,160 L400,182 L400,240 L0,240 Z"
          fill="url(#mid)" opacity=".95"/>

    <ellipse cx="200" cy="196" rx="190" ry="12" fill="#ffffff" opacity=".30"/>

    <!-- the near hills, with trees small enough to read as distance -->
    <path d="M0,200 C46,186 92,204 140,197 C188,190 226,208 276,200
             C326,192 368,206 400,199 L400,300 L0,300 Z" fill="url(#near)"/>
    <g fill="#2f6140" opacity=".8">
      <path d="M44,200 l6,-14 l6,14 Z"/><path d="M58,202 l5,-11 l5,11 Z"/>
      <path d="M118,197 l6,-15 l6,15 Z"/><path d="M132,199 l5,-12 l5,12 Z"/>
      <path d="M232,201 l6,-14 l6,14 Z"/><path d="M246,203 l5,-11 l5,11 Z"/>
      <path d="M330,200 l6,-15 l6,15 Z"/><path d="M344,202 l5,-12 l5,12 Z"/>
    </g>

    <!-- the meadow she is standing in -->
    <path d="M0,232 C64,219 128,239 192,231 C256,223 320,243 400,231 L400,300 L0,300 Z"
          fill="url(#meadow)"/>
    <g stroke="#2f6140" stroke-width="1.6" stroke-linecap="round" opacity=".45">
      <path d="M26,268 v-10 M30,270 v-7 M92,280 v-11 M96,282 v-8
               M300,274 v-10 M304,276 v-7 M366,264 v-9 M370,266 v-6"/>
    </g>
    <g fill="#3a3f3a" opacity=".45">
      <path d="M86,62 q4,-4 8,0 q-4,-2 -8,0" /><path d="M100,70 q3,-3 6,0 q-3,-1.5 -6,0"/>
      <path d="M118,58 q3,-3 6,0 q-3,-1.5 -6,0"/>
    </g>
  </svg>
  <div class="scene-shade"></div>

  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>

  <svg id="toon" viewBox="0 0 320 470" width="320" height="470"
       aria-label="A drawn character who answers when you tap her">
    <defs>
      <!-- the lattice of the cape, drawn rather than shipped as a picture -->
      <pattern id="lattice" width="22" height="22" patternUnits="userSpaceOnUse"
               patternTransform="rotate(12)">
        <rect width="22" height="22" fill="#ffffff" opacity=".55"/>
        <path d="M-4,4 L4,-4 M0,22 L22,0 M18,26 L26,18" stroke="#ffffff" stroke-width="7"
              fill="none" opacity=".95"/>
      </pattern>
      <linearGradient id="kurta" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b65ad"/><stop offset="1" stop-color="#0d4681"/>
      </linearGradient>
      <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#e2735f" stop-opacity=".55"/>
        <stop offset="1" stop-color="#e2735f" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- the floor shadow stays put while she bounces, which is what sells the bounce -->
    <ellipse cx="160" cy="455" rx="86" ry="11" fill="#1d3a26" opacity=".30"/>

    <g id="body">
      <!-- arms behind the kurta so the sleeves read as sleeves -->
      <g id="armL">
        <path d="M96,232 C78,266 72,308 74,342 C75,356 88,358 92,345 C100,312 106,276 116,250 Z"
              fill="#15589c"/>
        <circle cx="82" cy="350" r="15" fill="#cd8f6b"/>
      </g>
      <g id="armR">
        <path d="M224,232 C242,266 248,308 246,342 C245,356 232,358 228,345 C220,312 214,276 204,250 Z"
              fill="#15589c"/>
        <circle cx="238" cy="350" r="15" fill="#cd8f6b"/>
      </g>

      <!-- kurta -->
      <path d="M160,206 C122,206 100,218 96,236 C88,282 82,350 78,432 L242,432
               C238,350 232,282 224,236 C220,218 198,206 160,206 Z" fill="url(#kurta)"/>
      <path d="M160,214 L160,300" stroke="#0a3b6e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="160" cy="246" r="5" fill="#c9a227"/>
      <circle cx="160" cy="272" r="5" fill="#c9a227"/>

      <!-- the cape over the shoulders -->
      <path d="M160,200 C120,200 96,214 88,236 C80,260 76,296 74,322
               C104,336 216,336 246,322 C244,296 240,260 232,236 C224,214 200,200 160,200 Z"
            fill="url(#lattice)" stroke="#e9eef4" stroke-width="1.5" opacity=".96"/>

      <!-- neck -->
      <path d="M142,176 L142,206 C148,214 172,214 178,206 L178,176 Z" fill="#bb7f5d"/>
    </g>

    <g id="head">
      <!-- hair behind -->
      <path d="M160,24 C106,24 86,66 88,112 C89,140 96,166 104,178
               C96,150 98,96 112,74 C140,52 180,52 208,74 C222,96 224,150 216,178
               C224,166 231,140 232,112 C234,66 214,24 160,24 Z" fill="#241a16"/>
      <circle cx="160" cy="186" r="22" fill="#241a16"/>

      <!-- ears and the gold hoops -->
      <ellipse cx="96" cy="118" rx="10" ry="15" fill="#c2855f"/>
      <ellipse cx="224" cy="118" rx="10" ry="15" fill="#c2855f"/>
      <circle cx="96" cy="140" r="9" fill="none" stroke="#c9a227" stroke-width="3.4"/>
      <circle cx="224" cy="140" r="9" fill="none" stroke="#c9a227" stroke-width="3.4"/>

      <!-- face -->
      <path d="M160,42 C118,42 102,74 102,110 C102,152 126,182 160,182
               C194,182 218,152 218,110 C218,74 202,42 160,42 Z" fill="#cd8f6b"/>

      <!-- the fringe, drawn over the face so the hairline sits right -->
      <path d="M160,40 C116,40 100,70 102,104 C112,84 124,74 140,70
               C152,78 170,78 182,70 C198,74 210,84 218,104 C220,70 204,40 160,40 Z"
            fill="#241a16"/>

      <circle class="blush" cx="124" cy="134" r="15" fill="url(#cheek)" opacity="0"/>
      <circle class="blush" cx="196" cy="134" r="15" fill="url(#cheek)" opacity="0"/>

      <path class="brow" id="browL" d="M122,96 Q136,89 150,95" stroke="#2c1d17"
            stroke-width="5" fill="none" stroke-linecap="round"/>
      <path class="brow" id="browR" d="M170,95 Q184,89 198,96" stroke="#2c1d17"
            stroke-width="5" fill="none" stroke-linecap="round"/>

      <g class="eye">
        <ellipse cx="136" cy="114" rx="15" ry="10.5" fill="#fdfdfd"/>
        <g class="iris" data-home="136,114">
          <circle cx="136" cy="114" r="7.2" fill="#4a2d20"/>
          <circle cx="136" cy="114" r="3.4" fill="#120a06"/>
          <circle cx="133" cy="111" r="2.1" fill="#fff"/>
        </g>
        <ellipse class="lid" cx="136" cy="114" rx="15.6" ry="11.2" fill="#cd8f6b"
                 style="transform:scaleY(0)"/>
      </g>
      <g class="eye">
        <ellipse cx="184" cy="114" rx="15" ry="10.5" fill="#fdfdfd"/>
        <g class="iris" data-home="184,114">
          <circle cx="184" cy="114" r="7.2" fill="#4a2d20"/>
          <circle cx="184" cy="114" r="3.4" fill="#120a06"/>
          <circle cx="181" cy="111" r="2.1" fill="#fff"/>
        </g>
        <ellipse class="lid" cx="184" cy="114" rx="15.6" ry="11.2" fill="#cd8f6b"
                 style="transform:scaleY(0)"/>
      </g>

      <path d="M160,124 C156,136 154,140 160,142 C166,140 164,136 160,124"
            fill="#bb7f5d" opacity=".75"/>

      <g id="mouth">
        <ellipse id="maw" cx="160" cy="158" rx="16" ry="11" fill="#7d2b32"
                 style="transform:scaleY(0)"/>
        <path id="lips" d="M142,156 Q160,168 178,156" stroke="#9c4a46" stroke-width="4.5"
              fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- where a finger can land: generous, invisible, and over everything else -->
    <rect class="hit" data-part="hair" x="86" y="18" width="148" height="56" rx="26"/>
    <rect class="hit" data-part="face" x="100" y="74" width="120" height="112" rx="40"/>
    <rect class="hit" data-part="body" x="86" y="206" width="148" height="150" rx="40"/>
    <circle class="hit" data-part="hand" cx="238" cy="350" r="34"/>
    <circle class="hit" data-part="hand" cx="82" cy="350" r="34"/>
  </svg>
</div>

<div class="side">
  <div class="tools">
    <button type="button" id="listen" aria-pressed="false">Hold to talk</button>
    <button type="button" id="waveBtn">Wave</button>
  </div>
  <p class="hint" id="hint">Tap her hair, her face, her hands — she answers back.</p>
  <p class="hint" id="voiceNote"></p>

  <div class="note">
    <p class="lead">அன்பார்ந்த பயனர்களுக்கு,</p>
    <p><strong class="underline-red">Melvin&#39;s Image Station</strong> தற்காலிகமாக செயல்படாது.</p>
    <p>நன்றி<br>இப்படிக்கு,<br>
      <strong id="secretRedirect">Melvin&#39;s இதயம்❤️</strong></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var toon = $('#toon'), bubble = $('#bubble'), hint = $('#hint');
  var head = $('#head'), bodyG = $('#body'), armR = $('#armR'), armL = $('#armL');
  var maw = $('#maw'), lips = $('#lips');
  var lids = [].slice.call(document.querySelectorAll('.lid'));
  var irises = [].slice.call(document.querySelectorAll('.iris'));
  var blush = [].slice.call(document.querySelectorAll('.blush'));

  /* ---------- what she says ----------
     Tamil if the device has a Tamil voice, English otherwise. Reading Tamil words out
     through an English voice is worse than saying it in English. */
  var LINES = {
    ta: {
      hair:  ['ஐயோ! தலையை தொடாதீங்க!', 'முடி கலைஞ்சு போச்சு!'],
      face:  ['சிரிக்க வைக்கிறீங்க!', 'என்ன பாக்குறீங்க?'],
      body:  ['கூச்சமா இருக்கு!', 'அடடா, கிச்சு கிச்சு!'],
      hand:  ['வணக்கம்!', 'ஹாய்!'],
      idle:  ['ஏதாவது சொல்லுங்க, நான் திருப்பி சொல்றேன்.'],
      hint:  'என் தலை, முகம், கையை தொடுங்க — நான் பதில் சொல்வேன்.',
      hold:  'பிடிச்சு பேசுங்க',
      busy:  'கேக்குறேன்…',
      ask:   'ஏதாவது சொல்லுங்க — திருப்பி சொல்றேன்.',
      brief: 'இன்னும் கொஞ்சம் நேரம் பிடிச்சு வைச்சிருங்க.',
      spoilt:'சரியா பதிவாகல — மறுபடியும் முயற்சி பண்ணுங்க.',
      ask2:  'மைக் யூஸ் பண்ண அனுமதி வேணும்.',
      none:  'இந்த browser-ல மைக் வேலை செய்யல.'
    },
    en: {
      hair:  ['Careful with the hair!', 'Hey, I just did that!'],
      face:  ["You're making me blush.", 'What are you looking at?'],
      body:  ['That tickles!', 'Stop it, that tickles!'],
      hand:  ['Hello there!', 'Hi!'],
      idle:  ["Say something and I'll say it back."],
      hint:  'Tap her hair, her face, her hands — she answers back.',
      hold:  'Hold to talk',
      busy:  'Listening…',
      ask:   'Say anything — I will say it back.',
      brief: 'Hold the button a little longer.',
      spoilt:'That did not record properly — try again.',
      ask2:  'She needs permission to use the microphone.',
      none:  'This browser cannot use the microphone.'
    }
  };
  /* She follows the page's own language. There is no voice list to consult any more:
     the words appear in the bubble as text, and the only SOUND is your own, so Tamil
     needs nothing installed. That was the entire problem before. */
  var lang = /^ta/i.test(document.documentElement.lang || '') ? 'ta' : 'en';
  var voiceNote = $('#voiceNote');

  var bubbleTimer;
  function show(text) {
    bubble.textContent = text;
    bubble.classList.add('on');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('on'); }, 3200);
  }

  /* The mouth while she talks. Driven by a timer rather than by phonemes — a mouth that
     opens and closes roughly in time reads as speech, and anything more would be a
     lip-sync engine. It stops the moment the utterance ends. */
  var mouthTimer = null;
  function mouthOn() {
    clearInterval(mouthTimer);
    mouthTimer = setInterval(function () {
      var open = 0.25 + Math.random() * 0.75;
      maw.style.transform = 'scaleY(' + open.toFixed(2) + ')';
      lips.setAttribute('d', open > .55
        ? 'M140,152 Q160,172 180,152' : 'M142,156 Q160,166 178,156');
    }, 110);
  }
  function mouthOff() {
    clearInterval(mouthTimer);
    mouthTimer = null;
    maw.style.transform = 'scaleY(0)';
    lips.setAttribute('d', 'M142,156 Q160,168 178,156');
  }

  /* What she says, and how long her mouth moves for. Nothing is synthesised: the bubble
     is the line, and the only sound the page ever makes is your own voice played back.
     While that is playing the mouth is driven by the actual loudness instead — see below. */
  var mouthStop = null;
  function say(text) {
    show(text);
    mouthOn();
    clearTimeout(mouthStop);
    mouthStop = setTimeout(mouthOff, 1200);
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* ---------- idle: breathing and blinking, so she is alive before anybody touches her ---------- */
  var breath = 0;
  setInterval(function () {
    if (busy) { return; }
    breath = 1 - breath;
    bodyG.style.transform = breath ? 'scale(1.012) translateY(-1.5px)' : 'scale(1)';
  }, 1900);

  function blink() {
    lids.forEach(function (l) { l.style.transform = 'scaleY(1)'; });
    setTimeout(function () {
      lids.forEach(function (l) { l.style.transform = 'scaleY(0)'; });
    }, 105);
    setTimeout(blink, 2200 + Math.random() * 4200);
  }
  setTimeout(blink, 1200);

  /* Eyes follow the finger or the pointer, within a few pixels of their sockets. */
  function look(clientX, clientY) {
    var r = toon.getBoundingClientRect();
    var nx = ((clientX - r.left) / r.width - .5) * 2;
    var ny = ((clientY - r.top) / r.height - .5) * 2;
    var dx = Math.max(-1, Math.min(1, nx)) * 3.4;
    var dy = Math.max(-1, Math.min(1, ny)) * 2.6;
    irises.forEach(function (g) {
      g.style.transform = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px)';
    });
  }
  toon.addEventListener('pointermove', function (e) { look(e.clientX, e.clientY); });
  toon.addEventListener('pointerleave', function () {
    irises.forEach(function (g) { g.style.transform = 'translate(0,0)'; });
  });

  /* ---------- reactions ---------- */
  var busy = false;
  function act(name) {
    busy = true;
    setTimeout(function () { busy = false; }, 900);
    if (name === 'hair') {
      head.style.transform = 'rotate(-7deg) translateY(4px)';
      $('#browL').setAttribute('d', 'M122,92 Q136,101 150,95');
      $('#browR').setAttribute('d', 'M170,95 Q184,101 198,92');
      setTimeout(function () {
        head.style.transform = '';
        $('#browL').setAttribute('d', 'M122,96 Q136,89 150,95');
        $('#browR').setAttribute('d', 'M170,95 Q184,89 198,96');
      }, 700);
    } else if (name === 'face') {
      blush.forEach(function (b) { b.style.opacity = '1'; });
      head.style.transform = 'rotate(5deg)';
      setTimeout(function () {
        blush.forEach(function (b) { b.style.opacity = '0'; });
        head.style.transform = '';
      }, 1500);
    } else if (name === 'body') {
      bodyG.style.transform = 'translateY(-10px) scale(1.03)';
      head.style.transform = 'rotate(-4deg) translateY(-6px)';
      setTimeout(function () {
        bodyG.style.transform = '';
        head.style.transform = 'rotate(3deg)';
        setTimeout(function () { head.style.transform = ''; }, 260);
      }, 280);
    } else if (name === 'hand') {
      var n = 0;
      (function flap() {
        armR.style.transform = 'rotate(' + (n % 2 ? -52 : -22) + 'deg)';
        if (++n < 6) { setTimeout(flap, 190); }
        else { setTimeout(function () { armR.style.transform = ''; }, 220); }
      })();
      head.style.transform = 'rotate(4deg)';
      setTimeout(function () { head.style.transform = ''; }, 1100);
    }
    say(pick(LINES[lang][name]));
  }

  [].slice.call(document.querySelectorAll('.hit')).forEach(function (area) {
    area.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      look(e.clientX, e.clientY);
      act(area.dataset.part);
    });
  });
  $('#waveBtn').addEventListener('click', function () { act('hand'); });

  /* ---------- hearing you, and giving it back higher ----------
     Nothing here is text-to-speech. She records what you say and plays the SOUND back,
     lifted in pitch, which is how a toy like this has always worked — and why it never
     cared what language you spoke. Tamil needs no installed voice because nothing is
     being synthesised: it is your own audio, pitched up.

     The recording never leaves the device. It is decoded and played here, and then
     dropped when the playback ends. That is also a real improvement on dictation, which
     in most browsers uploads the audio to a server to be transcribed.

     PITCH is the speed and so also the pitch: 1.34 is a perfect fourth up, 2^(5/12), so
     six seconds of you comes back in four and a half. Keeping the original length instead
     means cutting the sound into grains and overlapping them, which was the first thing
     tried here — and measured, the grains do not line up in phase, so each harmonic lands
     up to 18 Hz out in its own direction. That sounds like a broken radio rather than like
     a higher voice. Running short is the honest trade, and the one the toy makes too. */
  var PITCH = 1.34;                 // how much higher than you. 1 would be your own voice.
  var MAX_SECONDS = 6;
  var actx = null, micStream = null, rec = null, chunks = [], taping = false, capTimer = null;
  var btn = $('#listen');

  function ctx() {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) { return null; }
    if (!actx) { actx = new C(); }
    /* Phones start the audio engine suspended and only let a gesture wake it, so this is
       called from the touch that starts recording rather than on load. */
    if (actx.state === 'suspended' && actx.resume) { actx.resume(); }
    return actx;
  }

  function canRecord() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
              window.MediaRecorder && (window.AudioContext || window.webkitAudioContext));
  }

  function note(text) { voiceNote.textContent = text || ''; }
  function idle() {
    taping = false;
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = LINES[lang].hold;
  }

  /* Her mouth follows the loudness of what is actually playing, so it is in time with the
     words rather than guessing at them the way the idle timer does. */
  function mouthFollows(analyser) {
    var data = new Uint8Array(analyser.frequencyBinCount);
    var going = true;
    (function frame() {
      if (!going) { return; }
      analyser.getByteTimeDomainData(data);
      var peak = 0;
      for (var i = 0; i < data.length; i += 4) {
        var v = Math.abs(data[i] - 128) / 128;
        if (v > peak) { peak = v; }
      }
      var open = Math.min(1, peak * 3.2);
      maw.style.transform = 'scaleY(' + open.toFixed(2) + ')';
      lips.setAttribute('d', open > .45
        ? 'M140,152 Q160,172 180,152' : 'M142,156 Q160,166 178,156');
      if (window.requestAnimationFrame) { window.requestAnimationFrame(frame); }
    })();
    return function () { going = false; mouthOff(); };
  }

  function playBack(blob) {
    var c = ctx();
    if (!c) { note(LINES[lang].none); return; }
    blob.arrayBuffer().then(function (buf) {
      return c.decodeAudioData(buf);
    }).then(function (sound) {
      if (!sound || sound.duration < 0.25) { note(LINES[lang].brief); return; }
      var source = c.createBufferSource();
      source.buffer = sound;
      source.playbackRate.value = PITCH;
      var gain = c.createGain();
      gain.gain.value = 1.15;                    // phone speakers are not generous
      var analyser = c.createAnalyser();
      analyser.fftSize = 512;
      source.connect(gain); gain.connect(analyser); analyser.connect(c.destination);
      clearTimeout(mouthStop);                   // the idle mouth must not fight the analyser
      mouthOff();
      var stop = mouthFollows(analyser);
      head.style.transform = 'rotate(3deg)';
      source.onended = function () { stop(); head.style.transform = ''; note(''); };
      show('♪');
      source.start();
    })['catch'](function () {
      note(LINES[lang].spoilt);
      mouthOff();
    });
  }

  function startTaping() {
    if (taping) { return; }
    if (!canRecord()) { note(LINES[lang].none); return; }
    ctx();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      micStream = s;
      chunks = [];
      rec = new MediaRecorder(s);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) { chunks.push(e.data); } };
      rec.onstop = function () {
        idle();
        micStream.getTracks().forEach(function (tr) { tr.stop(); });
        micStream = null;
        if (chunks.length) { playBack(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })); }
        else { note(LINES[lang].brief); }
      };
      rec.start();
      taping = true;
      btn.setAttribute('aria-pressed', 'true');
      btn.textContent = LINES[lang].busy;
      note(LINES[lang].ask);
      /* A finger that slides off the button never fires pointerup, and permission can be
         granted long after the finger has gone. Either way it stops on its own. */
      clearTimeout(capTimer);
      capTimer = setTimeout(stopTaping, MAX_SECONDS * 1000);
    })['catch'](function () {
      idle();
      note(LINES[lang].ask2);
    });
  }

  function stopTaping() {
    clearTimeout(capTimer);
    if (!taping || !rec) { return; }
    try { rec.stop(); } catch (e) { idle(); }
  }

  idle();
  if (!canRecord()) { note(LINES[lang].none); }
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); startTaping(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (k) {
    btn.addEventListener(k, function () { stopTaping(); });
  });
  /* Keyboards do not send pointer events, so the button would be dead to them. A tap also
     fires a click after pointerup, which would start a second recording — the difference
     is that a keyboard click carries no click count, so `detail` is 0. That one press
     records for a couple of seconds instead of for as long as it is held. */
  btn.addEventListener('click', function (e) {
    if (e.detail) { return; }
    if (taping) { stopTaping(); return; }
    startTaping();
    clearTimeout(capTimer);
    capTimer = setTimeout(stopTaping, 2600);
  });

  /* Three taps on the sign-off adds ?valid=1 and reloads. Unchanged. */
  var clickCount = 0, secretTimer;
  document.getElementById('secretRedirect').addEventListener('click', function () {
    clickCount++;
    clearTimeout(secretTimer);
    secretTimer = setTimeout(function () { clickCount = 0; }, 1000);
    if (clickCount === 3) {
      var url = new URL(window.location.href);
      url.searchParams.set('valid', '1');
      window.location.href = url.toString();
    }
  });

  hint.textContent = LINES[lang].hint;
  show(pick(LINES[lang].idle));
})();
</script>
</body>
</html>
