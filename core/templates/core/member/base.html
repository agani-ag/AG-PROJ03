{% load static %}<!DOCTYPE html>
<html lang="en"{% if member.theme and member.theme != 'system' %} data-theme="{{ member.theme }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>try{var t=localStorage.getItem("synchub-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    {% include "_theme_color.html" with light="#ffffff" dark="#16202a" %}
    <title>{% block title %}SyncHub{% endblock %} · {{ app_name }}</title>
    <link rel="icon" href="{% static 'images/app-icon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static_v 'core/member.css' %}">
</head>
<body{% if sso_url %} data-sso-url="{{ sso_url }}"{% endif %}{% if member %} data-changed-url="{% url 'member_sso_changed' %}"{% endif %}{% if auto_sso %} data-auto-sso="1"{% endif %}>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m-hub" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
  <symbol id="m-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="3.5"/><path d="m10 13 9-9"/><path d="m16 7 2 2"/><path d="m19 4 2 2"/></symbol>
  <symbol id="m-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="m-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="m-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="m-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="m-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="m-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="m-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="m-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9c-4 0-7.4-2.6-8.6-6.2"/><path d="M3 12a9 9 0 0 1 9-9c4 0 7.4 2.6 8.6 6.2"/><path d="m3 20 .4-5.2 5.2.4"/><path d="m21 4-.4 5.2-5.2-.4"/></symbol>
  <symbol id="m-flower" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 9a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/><path d="M12 21a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/><path d="M15 12a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"/><path d="M3 12a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"/></symbol>
  <symbol id="m-wallet" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 8V7a2 2 0 0 1 2-2h10"/><path d="M19 11h2v4h-2a2 2 0 0 1 0-4z"/></symbol>
  <symbol id="m-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></symbol>
</svg>

<main class="wrap{% block wrap_class %}{% endblock %}">
    {% if messages %}{% for m in messages %}
    <div class="flash {{ m.level_tag }}">{{ m }}</div>
    {% endfor %}{% endif %}
    {% block content %}{% endblock %}
</main>

<script src="{% static_v 'core/member.js' %}"></script>
{% block script %}{% endblock %}
</body>
</html>
